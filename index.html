<!-- SCRIPT DE INTRO RESISTENTE A FALLOS (ABRE LA APP SÍ O SÍ) -->
<script>
  (function() {
    const overlay = document.getElementById('app-intro-overlay');
    const video = document.getElementById('intro-video');
    if (!overlay) return;

    let isDone = false;
    function finishIntro() {
      if (isDone) return;
      isDone = true;
      overlay.style.transition = 'opacity 0.4s ease';
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      setTimeout(function() {
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      }, 400);
    }

    // 1. Tocar cualquier parte de la pantalla abre la app de inmediato
    overlay.addEventListener('click', finishIntro);
    overlay.addEventListener('touchstart', finishIntro, { passive: true });

    // 2. Si hay video, intentar reproducir y cerrar automáticamente al terminar
    if (video) {
      video.muted = true;
      video.addEventListener('ended', finishIntro);
      video.addEventListener('error', finishIntro);
      const playP = video.play();
      if (playP !== undefined) {
        playP.catch(function() {
          setTimeout(finishIntro, 400);
        });
      }
    }

    // 3. Seguro infalible: a los 3.2 segundos se abre la app siempre
    setTimeout(finishIntro, 3200);
  })();
</script>
