name: Compilar APK de prueba

# Se dispara a mano desde la pestaña "Actions" del repositorio (botón "Run workflow").
# Arma un APK de PRUEBA (firma de debug) para instalar y probar en tu celular.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug)
        run: gradle -p android assembleDebug --no-daemon

      - name: Subir APK generado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pilo-presupuestos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pilo-presupuestos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
